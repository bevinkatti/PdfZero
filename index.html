<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- Primary SEO -->
    <title>PDFZero — Free Browser-Based PDF Editor</title>
    <meta name="description" content="PDFZero is a free, open-source, browser-based PDF editor. Edit text, annotate, merge, split, compress, reorder pages — no uploads, no sign-up required." />
    <link rel="canonical" href="https://pdfzero-editor.vercel.app/" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pdfzero-editor.vercel.app/" />
    <meta property="og:title" content="PDFZero — Free Browser-Based PDF Editor" />
    <meta property="og:description" content="Edit, annotate, merge, split, compress, and reorder PDF pages — free, open-source, and entirely in your browser. No file uploads, no account needed." />
    <meta property="og:site_name" content="PDFZero" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://pdfzero-editor.vercel.app/social-preview.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PDFZero — Free Browser-Based PDF Editor" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PDFZero — Free Browser-Based PDF Editor" />
    <meta name="twitter:description" content="Edit, annotate, merge, split, compress, and reorder PDF pages — free, open-source, and entirely in your browser." />
    <meta name="twitter:image" content="https://pdfzero-editor.vercel.app/social-preview.svg" />
    <meta name="twitter:image:alt" content="PDFZero — Free Browser-Based PDF Editor" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "PDFZero",
      "url": "https://pdfzero-editor.vercel.app/",
      "description": "PDFZero is a free, open-source, browser-based PDF editor. Edit text inside PDFs, add text, create multi page layouts, annotate, merge, split, compress, and reorder PDF pages — no uploads, no sign-up required.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "Rupee"
      },
      "featureList": [
        "Edit PDF text in the browser",
        "Multi-page layout",
        "Annotate PDFs",
        "Merge multiple PDFs",
        "Split PDF pages",
        "Compress PDF file size",
        "Reorder PDF pages",
        "Rotate PDF pages",
        "Delete PDF pages",
        "OCR (Optical Character Recognition)",
        "Whiteout / erase PDF content",
        "Re-embed fonts"
      ],
      "isAccessibleForFree": true,
      "codeRepository": "https://github.com/bevinkatti/PdfZero",
      "license": "https://opensource.org/licenses/MIT"
    }
    </script>

    <!-- Google Fonts — UI typefaces -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- PDF font substitutes: loaded so overlays visually match embedded fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Lato:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
